<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      .thead-yellow th {
        background-color: #f1c40f; /* vàng đậm */
        color: #000; /* chữ đen cho dễ đọc */
      }
    </style>
  </head>
  <body>
    <div class="container mt-3">
      <!-- TIÊU ĐỀ -->
      <h4 class="text-danger text-center fw-bold mb-3">
        Bảng Thành Phần Dinh Dưỡng
      </h4>
      <!-- BẢNG -->
      <table class="table table-bordered align-middle">
        <thead class="thead-yellow text-center">
          <tr style="background-color: #e6c74f">
            <th rowspan="2">Thành Phần</th>
            <th colspan="2">Giá Trị</th>
          </tr>
          <tr style="background-color: #f1c40f">
            <th>Khối Lượng</th>
            <th>% DV*</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Calories</td>
            <td>200 kcal</td>
            <td>20%</td>
          </tr>
          <tr>
            <td>Chất Béo</td>
            <td>9 g</td>
            <td>14%</td>
          </tr>
          <tr>
            <td>Chất Béo Bão Hòa</td>
            <td>4 g</td>
            <td>20%</td>
          </tr>
          <tr>
            <td>Chất Đạm</td>
            <td>8 g</td>
            <td>16%</td>
          </tr>
          <tr>
            <td>Chất Xơ</td>
            <td>5 g</td>
            <td>20%</td>
          </tr>
          <tr>
            <td>Đường</td>
            <td>12 g</td>
            <td>-</td>
          </tr>
          <tr>
            <td rowspan="2">Vitamin</td>
            <td>Vitamin C</td>
            <td>25%</td>
          </tr>
          <tr>
            <td>Vitamin D</td>
            <td>10%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
