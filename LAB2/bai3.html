<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>LAB 3 - Tabs + Form</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>

  <body>
    <div class="container mt-4 w-25">
      <h4 class="mb-3">LAB 3 – Form & Tabs</h4>

      <!-- Tabs -->
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#register">
            Đăng ký
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#login"> Đăng nhập </a>
        </li>
      </ul>

      <div class="tab-content border p-3">
        <div class="tab-pane fade show active" id="register">
          <form class="was-validated">
            <div class="mb-2">
              <input class="form-control" placeholder="Họ và tên" required />
              <div class="invalid-feedback">Vui lòng nhập họ tên</div>
            </div>

            <div class="mb-2">
              <input
                type="email"
                class="form-control"
                placeholder="Email"
                required
              />
              <div class="invalid-feedback">Email không hợp lệ</div>
            </div>

            <div class="mb-2">
              <input
                type="password"
                class="form-control"
                placeholder="Mật khẩu"
                required
                minlength="6"
              />
              <div class="invalid-feedback">Ít nhất 6 ký tự</div>
            </div>

            <button class="btn btn-primary">Đăng ký</button>
          </form>
        </div>

        <div class="tab-pane fade" id="login">
          <form class="was-validated">
            <div class="mb-2">
              <input
                type="email"
                class="form-control"
                placeholder="Email"
                required
              />
              <div class="invalid-feedback">Vui lòng nhập email</div>
            </div>

            <div class="mb-2">
              <input
                type="password"
                class="form-control"
                placeholder="Mật khẩu"
                required
              />
              <div class="invalid-feedback">Vui lòng nhập mật khẩu</div>
            </div>

            <button class="btn btn-primary">Đăng nhập</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
